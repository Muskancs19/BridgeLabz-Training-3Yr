<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="Assignment5(5).css">
</head>
<body>

<main class="pricing-section">

    <h1>Choose Your Plan</h1>

    <div class="pricing-container">

        <article class="plan">
            <h2>Basic</h2>
            <div class="price">₹199/month</div>

            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>

            <a href="#">Choose Plan</a>
        </article>

        <article class="plan popular">
            <h2>Standard</h2>
            <div class="price">₹499/month</div>

            <ul>
                <li>20 Projects</li>
                <li>50 GB Storage</li>
                <li>Priority Support</li>
            </ul>

            <a href="#">Choose Plan</a>
        </article>

        <article class="plan">
            <h2>Premium</h2>
            <div class="price">₹999/month</div>

            <ul>
                <li>Unlimited Projects</li>
                <li>200 GB Storage</li>
                <li>24/7 Support</li>
            </ul>

            <a href="#">Choose Plan</a>
        </article>

    </div>

</main>

</body>
</html>
