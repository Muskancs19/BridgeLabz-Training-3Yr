<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="responsive css(8).css">
</head>
<body>

    <main>
        <section class="comparison">
            <h1>Before and After Filter</h1>

            <div class="comparison-container">

                <figure>
                    <img
                        src="https://picsum.photos/id/1015/600/400"
                        alt="Original mountain image"
                    >
                    <figcaption>Original Image</figcaption>
                </figure>

                <figure>
                    <img
                        class="filtered"
                        src="https://picsum.photos/id/1015/600/400"
                        alt="Filtered mountain image"
                    >
                    <figcaption>Filtered Image</figcaption>
                </figure>

            </div>
        </section>
    </main>

</body>
</html>
