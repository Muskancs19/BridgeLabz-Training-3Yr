<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="responsive css(5).css">
</head>
<body>

    <main>
        <section class="profiles">
            <h1>Our Team</h1>

            <div class="profile-container">

                <article class="profile-card">
                    <img src="https://i.pravatar.cc/400?img=12" alt="Profile of Alex">
                    <div class="profile-content">
                        <h2>Alex</h2>
                        <p>Frontend Developer</p>
                    </div>
                </article>

                <article class="profile-card">
                    <img src="https://i.pravatar.cc/400?img=32" alt="Profile of Sarah">
                    <div class="profile-content">
                        <h2>Sarah</h2>
                        <p>UI/UX Designer</p>
                    </div>
                </article>

                <article class="profile-card">
                    <img src="https://i.pravatar.cc/400?img=47" alt="Profile of David">
                    <div class="profile-content">
                        <h2>David</h2>
                        <p>Cybersecurity Analyst</p>
                    </div>
                </article>

            </div>
        </section>
    </main>

</body>
</html>
