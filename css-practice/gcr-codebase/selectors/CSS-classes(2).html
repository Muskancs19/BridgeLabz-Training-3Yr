<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="CSS-classes(2).css">
</head>
<body>

<header>
    <h1>CSS Tooltip Demonstration</h1>
</header>

<main>
    <section class="tooltip-container">

        <div class="tooltip-box">
            <span>HTML</span>
            <div class="tooltip">HyperText Markup Language</div>
        </div>

        <div class="tooltip-box">
            <span>CSS</span>
            <div class="tooltip">Cascading Style Sheets</div>
        </div>

        <div class="tooltip-box">
            <span>Flexbox</span>
            <div class="tooltip">A CSS layout system</div>
        </div>

        <div class="tooltip-box">
            <span>Grid</span>
            <div class="tooltip">A two-dimensional CSS layout system</div>
        </div>

    </section>
</main>

<footer>
    <p>Hover over each word to see its tooltip.</p>
</footer>

</body>
</html>
