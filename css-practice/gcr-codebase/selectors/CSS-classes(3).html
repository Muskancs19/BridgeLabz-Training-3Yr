<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="CSS-classes(3).css">
</head>
<body>

<header>
    <h1>Image Showcase</h1>
</header>

<main>
    <section class="gallery">

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=1" alt="Nature">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=2" alt="Mountain">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=3" alt="Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=4" alt="Ocean">
                <div class="overlay"></div>
            </div>
            <figcaption>Ocean View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=5" alt="City">
                <div class="overlay"></div>
            </div>
            <figcaption>Modern City</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=6" alt="Travel">
                <div class="overlay"></div>
            </div>
            <figcaption>Travel Destination</figcaption>
        </figure>

    </section>
</main>

<footer>
    <p>Responsive Image Gallery</p>
</footer>

</body>
</html>
