<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <link rel="stylesheet" href="CSS-classes(8).css">
</head>
<body>

<header>
    <h1>Box-Sizing Comparison</h1>
</header>

<main>

    <section class="comparison">

        <div class="box default-box">
            <h2>Default</h2>
            <p>
                With content-box, padding and border are added
                outside the declared width.
            </p>
        </div>

        <div class="box border-box">
            <h2>Border Box</h2>
            <p>
                With border-box, padding and border are included
                inside the declared width.
            </p>
        </div>

    </section>

</main>

<footer>
    <p>Understanding CSS Box-Sizing</p>
</footer>

</body>
</html>
