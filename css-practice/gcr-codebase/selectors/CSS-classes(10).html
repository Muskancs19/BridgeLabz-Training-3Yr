<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="CSS-classes(10).css">
</head>
<body>

<header>
    <h1>Student Registration</h1>
</header>

<main>
    <section class="card">

        <div class="content">

            <div class="image-area">
                <img
                    src="https://picsum.photos/300/220"
                    alt="Student learning"
                >
            </div>

            <div class="form-area">

                <h2>Registration Form</h2>

                <form>

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <label for="course">Course</label>
                    <select id="course">
                        <option>B.Tech CSE</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>

                    <div class="buttons">
                        <button type="submit">Submit</button>
                        <button type="reset" class="reset">
                            Reset
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </section>
</main>

<footer>
    <p>&copy; 2026 Student Portal</p>
</footer>

</body>
</html>
