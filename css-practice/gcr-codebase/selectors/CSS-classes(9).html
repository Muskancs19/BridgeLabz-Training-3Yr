<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="CSS-classes(9).css">
</head>
<body>

<header>
    <h1>Combined CSS Effects</h1>
</header>

<main>

    <section class="effects">

        <button class="effect-button blue">
            Hover Me
        </button>

        <button class="effect-button green">
            Transform Me
        </button>

        <button class="effect-button purple">
            Click Me
        </button>

    </section>

</main>

<footer>
    <p>Pseudo-Classes + Transitions + Transformations</p>
</footer>

</body>
</html>
