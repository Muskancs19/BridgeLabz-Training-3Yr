<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="CSS model(3).css">
</head>
<body>

    <header>
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>
        <section class="linear-section">
            <h2>Linear Gradient</h2>
            <p>
                This section uses a linear-gradient that smoothly changes
                between two colors.
            </p>
        </section>

        <section class="radial-section">
            <h2>Radial Gradient</h2>
            <p>
                This section uses a radial-gradient that spreads colors
                outward from a central point.
            </p>
        </section>
    </main>

    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>
