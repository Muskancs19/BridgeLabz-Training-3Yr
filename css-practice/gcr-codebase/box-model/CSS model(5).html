<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="CSS model(5).css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>

        <section class="form-section">
            <h2>Attribute Selectors</h2>

            <input type="text" placeholder="Text input">

            <input type="email" placeholder="Email input">

            <p>
                <a href="https://example.com">Secure HTTPS Link</a>
            </p>

            <p>
                <a href="http://example.com">Normal HTTP Link</a>
            </p>
        </section>

        <section class="list-section">
            <h2>List Selectors</h2>

            <ul class="items">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
                <li>Cybersecurity</li>
            </ul>
        </section>

        <section class="combinator-demo">
            <h2>Combinators</h2>

            <div class="parent">
                <p>Direct child paragraph</p>

                <div>
                    <p>Descendant paragraph</p>
                </div>

                <p>Another paragraph</p>
                <span>Sibling span</span>
                <span>Another sibling</span>
            </div>
        </section>

    </main>

    <footer>
        <p>CSS Selector Practice</p>
    </footer>

</body>
</html>
