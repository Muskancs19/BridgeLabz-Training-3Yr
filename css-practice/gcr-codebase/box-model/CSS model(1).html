<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="CSS model(1).css">
</head>
<body>

    <header>
        <h1>Borders & Padding Demonstration</h1>
    </header>

    <main>
        <section class="box-container">
            <div class="box solid">
                <h2>Solid Border</h2>
                <p>Padding: 10px</p>
            </div>

            <div class="box dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 20px</p>
            </div>

            <div class="box double">
                <h2>Double Border</h2>
                <p>Padding: 30px</p>
            </div>

            <div class="box groove">
                <h2>Groove Border</h2>
                <p>Rounded Corners</p>
            </div>
        </section>
    </main>

    <footer>
        <p>CSS Borders and Padding Practice</p>
    </footer>

</body>
</html>
