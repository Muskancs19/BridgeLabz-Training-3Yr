<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="CSS model(2).css">
</head>
<body>

    <header>
        <h1>Height & Width Practice</h1>
    </header>

    <main>
        <section class="container">
            <div class="box box-one">
                <h2>Box 1</h2>
                <p>200px × 150px</p>
            </div>

            <div class="box box-two">
                <h2>Box 2</h2>
                <p>50% width and 30vh height</p>
            </div>

            <div class="box box-three">
                <h2>Box 3</h2>
                <p>20em width with overflow</p>
                <p class="extra-text">
                    This extra text demonstrates the overflow property.
                    The content is intentionally larger than the box.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>CSS Size Units Practice</p>
    </footer>

</body>
</html>
