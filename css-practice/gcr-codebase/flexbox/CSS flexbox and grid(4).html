<!DOCTYPE html>
<html lang="en">
<head>

    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="CSS flexbox and grid(4).css">
</head>
<body>

<div class="dashboard">

    <header>
        <h1>My Dashboard</h1>

    <aside>
        <a href="#">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
