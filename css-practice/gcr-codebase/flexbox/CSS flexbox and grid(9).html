<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="CSS flexbox and grid(9).css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="card-front">
            <img src="https://picsum.photos/400/250" alt="Technology">
            <h2>Technology</h2>
        </div>

        <div class="card-back">
            <h2>About Technology</h2>
            <p>
                Technology helps us solve problems and makes our
                everyday lives easier.
            </p>
        </div>

    </div>

</div>

</body>
</html>
