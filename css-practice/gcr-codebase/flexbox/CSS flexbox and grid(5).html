<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="CSS flexbox and grid(5).css">
</head>
<body>

<h1>Pricing Plans</h1>

<section class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <h3>₹499/month</h3>
        <p>5 Projects</p>
        <p>10 GB Storage</p>
        <button>Choose Plan</button>
    </div>

    <div class="card featured">
        <h2>Premium</h2>
        <h3>₹999/month</h3>
        <p>20 Projects</p>
        <p>50 GB Storage</p>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Pro</h2>
        <h3>₹1499/month</h3>
        <p>Unlimited Projects</p>
        <p>100 GB Storage</p>
        <button>Choose Plan</button>
    </div>

</section>

</body>
</html>
