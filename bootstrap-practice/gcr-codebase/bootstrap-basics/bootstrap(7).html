<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="bootstrap(7).css">
</head>

<body class="bg-light">

<header class="bg-primary text-white py-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h1 class="mb-1">My Tasks</h1>
            <p class="mb-0">Stay productive every day.</p>
        </div>

        <!-- Badge counter -->
        <span class="badge bg-danger fs-6">
            4 Pending
        </span>
    </div>
</header>

<main class="container py-5">

    <section class="card shadow-sm">
        <div class="card-body">

            <h2 class="mb-4">Task List</h2>

            <div class="list-group">

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        Complete project report
                        <span class="badge bg-danger ms-2">High</span>
                    </div>
                    <button class="btn btn-success btn-sm">
                        Completed <span class="badge bg-light text-dark">1</span>
                    </button>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        Study Bootstrap
                        <span class="badge bg-warning text-dark ms-2">Medium</span>
                    </div>
                    <button class="btn btn-success btn-sm">
                        Completed <span class="badge bg-light text-dark">2</span>
                    </button>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        Update portfolio
                        <span class="badge bg-success ms-2">Low</span>
                    </div>
                    <button class="btn btn-success btn-sm">
                        Completed <span class="badge bg-light text-dark">3</span>
                    </button>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        Practice coding
                        <span class="badge bg-danger ms-2">High</span>
                    </div>
                    <button class="btn btn-success btn-sm">
                        Completed <span class="badge bg-light text-dark">4</span>
                    </button>
                </div>

            </div>

        </div>
    </section>

</main>

<footer class="bg-dark text-white text-center py-3">
    © 2026 Task Tracker
</footer>

</body>
</html>
