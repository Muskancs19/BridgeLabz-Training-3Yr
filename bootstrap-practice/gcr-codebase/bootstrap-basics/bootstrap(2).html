<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="bootstrap(2).css">
</head>

<body class="bg-light text-dark">

<header class="bg-dark text-white text-center p-5">
    <h1 class="fw-bold">Muskan Kumari</h1>
    <p class="lead mb-0">CSE Student | Cybersecurity & AI Enthusiast</p>
</header>

<main>
    <section class="container text-center mt-4">

        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80"
             class="img-fluid rounded-circle profile-image"
             alt="Profile photo">

        <h2 class="mt-4 fw-bold">Hello, I'm Muskan!</h2>

        <p class="lead">
            I am passionate about programming, cybersecurity,
            artificial intelligence and building useful applications.
        </p>

        <div class="mb-3">
            <button class="btn btn-primary me-2">Hire Me</button>
            <button class="btn btn-outline-dark">Download CV</button>
        </div>

    </section>

    <section class="container mt-4 mb-5">

        <div class="card shadow-sm p-4">
            <h3 class="text-center fw-bold mb-3">Contact Me</h3>

            <form>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control"
                           placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control"
                           placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="4"
                              placeholder="Write your message"></textarea>
                </div>

                <button class="btn btn-dark w-100">Send Message</button>
            </form>
        </div>

    </section>
</main>

<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© 2026 Muskan Kumari</p>
</footer>

</body>
</html>
