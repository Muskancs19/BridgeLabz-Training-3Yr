<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="bootstrap(3).css">
</head>

<body>

<header class="bg-dark text-white text-center py-4">
    <h1>TechStore</h1>
    <p class="mb-0">Technology for Everyone</p>
</header>

<main class="container py-5">

    <h2 class="text-center mb-4">Featured Products</h2>

    <div class="row g-4">

        <!-- col-md-3 = 4 columns on medium+ screens -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100 shadow-sm product-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top"
                     alt="Headphones">

                <div class="card-body text-center">
                    <h5 class="card-title">Wireless Headphones</h5>
                    <p class="text-primary fw-bold">₹2,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100 shadow-sm product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top"
                     alt="Smart Watch">

                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="text-primary fw-bold">₹3,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100 shadow-sm product-card">
                <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top"
                     alt="Laptop">

                <div class="card-body text-center">
                    <h5 class="card-title">Laptop</h5>
                    <p class="text-primary fw-bold">₹59,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100 shadow-sm product-card">
                <img src="https://images.unsplash.com/photo-1585386959984-a41552231693?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top"
                     alt="Smartphone">

                <div class="card-body text-center">
                    <h5 class="card-title">Smartphone</h5>
                    <p class="text-primary fw-bold">₹24,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>

<footer class="bg-dark text-white text-center py-3">
    © 2026 TechStore
</footer>

</body>
</html>
