<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Image Gallery</h2>
  <div id="gallery">
    <img src="https://picsum.photos/id/1015/300/200" alt="Mountain">
    <img src="https://picsum.photos/id/1016/300/200" alt="Forest">
    <img src="https://picsum.photos/id/1025/300/200" alt="Dog">
    <img src="https://picsum.photos/id/1035/300/200" alt="Nature">
    <img src="https://picsum.photos/id/1043/300/200" alt="Landscape">
    <img src="https://picsum.photos/id/1050/300/200" alt="Water">
  </div>
  <div id="modal" hidden>
    <div id="modalContent">
      <button id="closeButton">Close</button>
      <img id="largeImage" src="" alt="Large preview">
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
