<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

<h1>Select Your Travel Preferences</h1>

<label for="country">Country:</label>

<select id="country">
    <option value="india" selected>India</option>
    <option value="usa">USA</option>
    <option value="japan">Japan</option>
    <option value="france">France</option>
</select>
<br><br>
<label for="state">State:</label>
<select id="state">
    <option value="uttarpradesh" selected>Uttar Pradesh</option>
    <option value="delhi">Delhi</option>
    <option value="rajasthan">Rajasthan</option>
    <option value="maharashtra">Maharashtra</option>
</select>
<br><br>
<label for="city">City:</label>
<select id="city">
    <option value="mathura" selected>Mathura</option>
    <option value="agra">Agra</option>
    <option value="lucknow">Lucknow</option>
    <option value="varanasi">Varanasi</option>
</select>

<br><br>

<label for="place">Favorite Tourist Place:</label>

<select id="place">
    <option value="tajmahal" selected>Taj Mahal</option>
    <option value="gateway">Gateway of India</option>
    <option value="qutub">Qutub Minar</option>
    <option value="redfort">Red Fort</option>
</select>

<h2>My Choices</h2>

<p>
    My selected country is India, my state is Uttar Pradesh,
    my city is Mathura, and my favorite tourist place is the Taj Mahal.
</p>
</body>
</html>
