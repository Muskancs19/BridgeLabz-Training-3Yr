<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Sets the title of the webpage shown in the browser tab -->
    <title>My Webpage</title>

    <!-- Specifies the character encoding used by the webpage -->
    <meta charset="UTF-8">

    <!-- Gives a short description of the webpage -->
    <meta name="description" content="This is my HTML practice webpage">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Muskan">

    <!-- Sets the base URL for all relative links on the webpage -->
    <base href="https://example.com/">

    <!-- Links an external resource, here used for the favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Used to write CSS styles for the webpage -->
    <style>
        /* CSS can be written here */
    </style>

    <!-- Used to add JavaScript to the webpage -->
    <script>
        // JavaScript can be written here
    </script>

</head>

<body>

    <h1>Welcome to My Webpage</h1>
    <p>This page demonstrates important HTML head elements.</p>

</body>

</html>
