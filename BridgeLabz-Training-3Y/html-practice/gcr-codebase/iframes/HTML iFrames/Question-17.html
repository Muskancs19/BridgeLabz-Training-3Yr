<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- The result page will be displayed inside this iframe after submission. -->
    <iframe
        src=""
        name="resultFrame"
        width="500"
        height="150"
        title="Form Result">
    </iframe>

</body>
</html>
