<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Form</title>
</head>
<body>

    <h1>Secure Form</h1>

    <form action="#" method="post" autocomplete="off">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required>

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required>

        <br><br>

        <input type="submit" value="Login">

    </form>

    <p>
        Turning off autocomplete can reduce the browser's automatic
        storage and filling of sensitive form information. However,
        autocomplete="off" alone is not a complete security measure.
    </p>

</body>
</html>
