<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient</title>
    <style>
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip-text {
            visibility: hidden;
           position: absolute;
            background: black;
            color: white;
            padding: 8px;

        }
        .tooltip:hover .tooltip-text {
            visibility: visible;
        }
        .box {
            width: 300px;
            height: 200px;
            background: radial-gradient(
                circle,
                blue,
                purple
            );
            color: aliceblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }
    </style>
</head>
<body>

    </div>
</body>
</html>
