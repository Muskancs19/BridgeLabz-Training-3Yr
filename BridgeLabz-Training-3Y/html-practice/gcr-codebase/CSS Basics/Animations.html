<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            background-color: beige;
            border: 5px solid black;
        }
        .box{
              width: 350px;
              height: 100px;
              background-color: blue;
              border: 3px solid red;
              border-radius: 10px;
              margin: 10px;
              position: relative;
              animation-name: rightmovement;
              animation-duration: 5s;
              animation-iteration-count: 2;
             /* animation-delay: 1s;*/
              animation-timing-function: linear;
            /*  animation-direction: alternate-reverse;*/
            animation-fill-mode: backwards;
         
           
        }
        @keyframes rightmovement{
            from{
                top: 0;
                left: 0;
            }
            to{
                top: 0;
                left: 1200px;
            }
        }
        #box1{
            width: 350px;
              height: 100px;
              background-color: blue;
              border: 3px solid red;
              border-radius: 10px;
              margin: 10px;
              position: relative;
              animation-name: leftmovement;
              animation: 5s ease-in 1s infinite alternate none running leftmovement;
        }
        @keyframes leftmovement{
            from{
                top: 650px;
                left: 1350px;
            }
            to{
                top: 650px;
                left: 0;
            }
        }
        #circle{
         width: 100px;
              height: 100px;
              background-color: blue;
              border: 3px solid red;
              border-radius: 50px;
              margin: 10px;
              position: relative;
              top: 30%;
              left: 40%;
              animation: 10s ease-in-out 0s infinite alternate-reverse none running circlemovement;
        }
        @keyframes circlemovement{
            0%{
                top: 1%;
                left: 5%;

            }
            30%{
                top: 5%;
                left: 90%;
            }
            60%{
                top: 70%;
                left: 10%;
            }
            100%{
                top: 75%;
                left: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
        <div id="box1"></div>
        <div id="circle"></div>
    </div>
</body>
</html>
